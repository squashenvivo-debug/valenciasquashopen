<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria | PSA Valencia Open</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" type="image/x-icon" href="assets/images/icons/favicon.ico">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css?v=20260811-v3">
</head>
<body class="gallery-page">

<main class="gallery-page-main">
    <div class="container">
        <header class="gallery-page-header">
            <h1 class="gallery-page-title" id="galleryPageTitle" data-i18n="psaGallery.defaultTitle">Galeria</h1>
            <a class="gallery-back-link" href="index.html#gallery" data-i18n="psaGallery.backLink">Salir de galeria</a>
        </header>

        <p id="galleryResultsSummary" class="gallery-filter-summary"></p>

        <div id="galleryDetailGrid" class="gallery-detail-grid"></div>
        <p id="galleryDetailEmpty" class="gallery-empty" style="display:none;" data-i18n="psaGallery.noPhotos">No hay fotos en esta galeria.</p>
    </div>
</main>

<div id="galleryLightbox" class="gallery-lightbox" aria-hidden="true">
    <button id="galleryLightboxClose" class="gallery-lightbox-close" type="button" aria-label="Cerrar">X</button>
    <img id="galleryLightboxImage" class="gallery-lightbox-image" alt="Foto ampliada">
    <p id="galleryLightboxCaption" class="gallery-lightbox-caption"></p>
    <div class="gallery-lightbox-actions">
        <button type="button" id="galleryDownloadBtn" class="gallery-action-btn gallery-action-download">
            ⬇️ <span data-i18n="psaGallery.download">Descargar</span>
        </button>
        <button type="button" id="galleryShareNative" class="gallery-action-btn gallery-action-share">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            <span data-i18n="psaGallery.shareLabel">Compartir</span>
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="js/runtime-optimizations.js?v=20260803-1"></script>
<script src="js/cloud-store.js?v=20260726-4"></script>
<script src="js/visit-analytics.js?v=20260726-1"></script>
<script src="js/photo-analytics.js?v=20260808-v1"></script>
<script src="js/language.js?v=20260811-v9"></script>
<script src="js/modal-history.js?v=20260810-v1"></script>
<script src="js/gallery.js?v=20260811-v12"></script>
</body>
</html>
