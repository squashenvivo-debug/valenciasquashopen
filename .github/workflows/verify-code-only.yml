name: Verify Code Only Repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check media binaries tracked in assets
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.svg" -o -iname "*.ico" \) || true)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "::warning::Media binaries detected in repository (assets)."
            printf '%s\n' "${files[@]}"
          fi
          exit 0
