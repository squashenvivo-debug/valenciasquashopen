<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PSA Valencia Open — Archivo histórico</title>
<style>
:root{
  --navy:#071a31;
  --navy-light:#0e2c4d;
  --gold:#d4af37;
  --ink:#102b4e;
  --paper:#f4f7fa;
  --text:#26384d;
  --muted:#6b7c90;
  --card:#ffffff;
  --border:#e1e7ee;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  background:var(--paper);
  color:var(--text);
  line-height:1.6;
}
header.hero{
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-light) 100%);
  color:#fff;
  padding:56px 20px 44px;
  text-align:center;
}
.hero .eyebrow{
  letter-spacing:3px;
  font-size:.8rem;
  color:var(--gold);
  font-weight:700;
  text-transform:uppercase;
}
.hero h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:14px 0 8px;}
.hero p{color:#c9d5e3;max-width:600px;margin:0 auto;}

main{max-width:900px;margin:0 auto;padding:44px 20px 60px;}

.years-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}
.year-card{
  display:block;
  text-decoration:none;
  color:inherit;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:28px 24px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.year-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(7,26,49,.12);}
.year-card .year{
  font-size:2.2rem;
  font-weight:800;
  color:var(--ink);
}
.year-card .year-sub{color:var(--muted);font-size:.9rem;margin-top:4px;}
.year-card .year-tag{
  display:inline-block;
  margin-top:12px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--gold);
}

footer{
  text-align:center;
  padding:30px 20px 50px;
  color:var(--muted);
  font-size:.85rem;
}
footer a{color:var(--ink);font-weight:600;}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">PSA Valencia Open</div>
  <h1>Archivo histórico</h1>
  <p>Copias congeladas del torneo, edición a edición. Cada año se guarda tal como estaba al terminar, sin depender de servicios externos que puedan desaparecer.</p>
</header>

<main>
  <div class="years-grid">
    <a class="year-card" href="2026/">
      <div class="year">2026</div>
      <div class="year-sub">Memorial Chimo Marmaneu · Alboraya</div>
      <div class="year-tag">Ver edición ↗</div>
    </a>
  </div>
</main>

<footer>
  <p>La web en vivo sigue en <a href="https://psavalenciaopen.com">psavalenciaopen.com</a>.</p>
</footer>

</body>
</html>
